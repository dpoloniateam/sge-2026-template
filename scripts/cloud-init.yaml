#cloud-config
# Instala o Docker na VM e prepara o utilizador azureuser. O repositorio da equipa clona-se depois do primeiro ssh.
# So ASCII neste ficheiro: o Azure estraga os acentos e o cloud-init deita o ficheiro fora (sem Docker).
package_update: true
packages: [git, curl, ca-certificates]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker azureuser
  - systemctl enable --now docker
